# Fail-soft coverage targets — informational until soak raises floors.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

flags:
  python:
    paths:
      - src/
  frontend:
    paths:
      - frontend/src/
