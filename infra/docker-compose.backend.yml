services:
  redis:
    image: redis:7-alpine
    # Host publishes are loopback-only (bot-server has LAN + public IPv6).
    # requirepass is mandatory so a mistaken 0.0.0.0 republish is still not open.
    # Inter-container clients use service name `redis` + REDIS_PASSWORD from env_file.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # Stay under mem_limit (128m). Prefer evicting keys that carry a TTL
      # (prices, caches, kalman sliding TTL) before OOMing the container.
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-trading_bot}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot_admin} -d ${POSTGRES_DB:-trading_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    # Image is built & pushed by the GitHub Actions build jobs; the mini PC only pulls.
    # Override IMAGE_OWNER / IMAGE_TAG via env if you ever need a different tag.
    # BOT_HOST_PORT defaults to 8080; on bot-server use 8082 to avoid SearXNG on :8080.
    image: ghcr.io/${IMAGE_OWNER:-daniel730}/trading-bot-base:${IMAGE_TAG:-latest}
    # Pin public resolvers. Tailscale MagicDNS (100.100.100.100) often returns SERVFAIL
    # for public names; Docker embeds host resolvers at create-time and will stay broken
    # across MagicsDNS flaps until recreate. Do not remove without an equivalent fix.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${BOT_HOST_PORT:-8080}:8080"
    env_file:
      - ${APP_ENV_FILE:-../.env}
    volumes:
      - ${APP_ENV_FILE:-../.env}:/app/.env:ro
      # Survives image pulls / recreates: 2FA, dashboard overrides, pairs, SQLite auth state.
      - bot_data:/app/data
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    restart: "no"
    mem_limit: 1280m
    cpus: 1.50
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Optional sidecars — not on the Alpaca monitor hot path.
  # Start with: docker compose --profile optional up -d
  mcp-server:
    profiles: ["optional"]
    # Shares the trading-bot-base image built by the `bot` service above.
    # No `build:` block here so Compose doesn't redundantly re-run the build.
    image: ghcr.io/${IMAGE_OWNER:-daniel730}/trading-bot-base:${IMAGE_TAG:-latest}
    command: python src/mcp_server.py
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # FastMCP has no network auth layer; keep the host publish on loopback only.
    # Inside the container listen on 0.0.0.0 so Docker can map 127.0.0.1:8000.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ${APP_ENV_FILE:-../.env}
    volumes:
      - ${APP_ENV_FILE:-../.env}:/app/.env:ro
      - bot_data:/app/data
    environment:
      REDIS_HOST: redis
      MCP_HOST: "0.0.0.0"
      MCP_ALLOW_NON_LOOPBACK: "true"
    restart: "no"
    mem_limit: 384m
    cpus: 0.75
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.create_connection(('127.0.0.1', 8000), 3); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  execution-engine:
    profiles: ["optional"]
    image: ghcr.io/${IMAGE_OWNER:-daniel730}/execution-engine:${IMAGE_TAG:-latest}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # gRPC sidecar is only needed on-host / via compose network — not LAN/IPv6.
    ports:
      - "127.0.0.1:50051:50051"
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DRY_RUN: "true"
      LIVE_CAPITAL_DANGER: "false"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  sec-worker:
    # Shares the trading-bot-base image built by the `bot` service above.
    image: ghcr.io/${IMAGE_OWNER:-daniel730}/trading-bot-base:${IMAGE_TAG:-latest}
    command: python src/daemons/sec_fundamental_worker.py
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ${APP_ENV_FILE:-../.env}
    volumes:
      - ${APP_ENV_FILE:-../.env}:/app/.env:ro
      - bot_data:/app/data
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.75
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redis_data:
    name: trading-bot_redis_data
    external: true
  postgres_data:
    name: trading-bot_postgres_data
    external: true
  bot_data:
    name: trading-bot_bot_data
    external: true
